services:
  # Kafka брокер для демонстрации асинхронного взаимодействия
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 'qtYbt63pSCSv97tf2L1L_g'

  # Отдельный инстанс Swagger UI (демонстрация использования UI для нескольких приложений)
  # По умолчанию он будет доступен на порту 8081
  swagger-ui:
    image: swaggerapi/swagger-ui
    container_name: swagger-ui-external
    ports:
      - "8081:8080"
    environment:
      # Список URL для переключения между спецификациями OpenAPI.
      # ПРИМЕЧАНИЕ: Swagger UI не поддерживает спецификации AsyncAPI.
      # Для просмотра AsyncAPI используйте: http://localhost:8080/springwolf/asyncapi-ui.html
      URLS: "[{ url: 'http://localhost:8080/api-docs', name: 'App 1 - OpenAPI' }]"
    extra_hosts:
      - "host.docker.internal:host-gateway"
